services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: careerflow, POSTGRES_USER: careerflow, POSTGRES_PASSWORD: careerflow}
    healthcheck: {test: ["CMD-SHELL","pg_isready -U careerflow"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [careerflow_data:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment: {DATABASE_URL: "postgresql+asyncpg://careerflow:careerflow@db:5432/careerflow", JWT_SECRET: "replace-with-a-random-production-secret"}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  web:
    build: .
    ports: ["8080:80"]
    depends_on: [api]
volumes: {careerflow_data: {}}
